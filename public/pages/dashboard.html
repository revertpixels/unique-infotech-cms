<section class="page">
  <div class="page-head">
    <h2 id="dash-greeting"></h2>
    <p class="text-mute">Your overview appears here.</p>
  </div>
  <div class="kpi-strip">
    <div class="kpi"><span class="kpi-label">Students</span><span class="kpi-value" id="dash-kpi-students">—</span></div>
    <div class="kpi"><span class="kpi-label">Collected today</span><span class="kpi-value" id="dash-kpi-collected">—</span></div>
    <div class="kpi"><span class="kpi-label">Dues pending</span><span class="kpi-value" id="dash-kpi-dues">—</span></div>
    <div class="kpi"><span class="kpi-label">Overdue</span><span class="kpi-value" id="dash-kpi-overdue">—</span></div>
  </div>
  <div class="card">
    <div class="card-body">
      <div class="empty-state">
        <i data-lucide="inbox"></i>
        <h3>No activity to show yet</h3>
        <p>Live figures appear here once students and fees are recorded.</p>
      </div>
    </div>
  </div>
</section>
