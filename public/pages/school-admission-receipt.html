<div class="uk-receipt-page">
  <header class="uk-toolbar">
    <div class="uk-toolbar-left">
      <button type="button" id="uk-back" class="ui-btn ghost"><i data-lucide="arrow-left"></i> Back to students</button>
      <button type="button" id="uk-profile-btn" class="ui-btn ghost"><i data-lucide="user"></i> View student's profile</button>
    </div>
    <div class="uk-toolbar-spacer"></div>
    <div class="uk-toolbar-right">
      <div id="uk-course-select" class="uk-course-select-wrap"></div>
      <button type="button" id="uk-download" class="ui-btn primary"><i data-lucide="download"></i> Download PDF</button>
      <button type="button" id="uk-print" class="ui-btn ghost"><i data-lucide="printer"></i> Print</button>
    </div>
  </header>
  <div id="uk-loading" class="uk-loading">Loading receipt…</div>
  <div id="uk-notfound" class="uk-notfound" hidden>
    <i data-lucide="alert-circle"></i>
    <h2>Receipt not found</h2>
    <p>The admission record could not be loaded.</p>
    <button type="button" id="uk-nf-back" class="ui-btn ghost"><i data-lucide="arrow-left"></i> Back to students</button>
  </div>
  <div id="uk-sheet" class="uk-sheet"></div>
</div>
